<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel's Website</title>
    <style>
        /* Modern, clean styling designed for mobile screens */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #38bdf8;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #fff;
        }

        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, background 0.2s;
        }

        /* Adds a smooth touch effect when tapped on phone */
        .btn:active {
            transform: scale(0.98);
            background: #0ea5e9;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Icon -->
        <div class="profile-img">🚀</div>

        <h1>Hi, I'm Samuel!</h1>
        <p>Welcome to my corner of the internet. I built and published this website entirely using my smartphone!</p>

        <!-- Links -->
        <div class="links-container">
            <a href="https://github.com" target="_blank" class="btn">My GitHub</a>
            <a href="https://twitter.com" target="_blank" class="btn">Connect on X</a>
            <a href="mailto:your-email@example.com" class="btn">Email Me</a>
        </div>

        <div class="footer">
            Built by Samuel on a mobile device & Powered by Samuel 
        </div>
    </div>

</body>
</html>
